<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vigilant Guardian{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark vg-navbar">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="{{ url_for('index') }}">
                <i class="bi bi-shield-lock-fill me-2 text-accent"></i>
                <span class="fw-bold">Vigilant Guardian</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMain">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if not current_severity and not current_kev and not search_query %}active{% endif %}"
                           href="{{ url_for('index') }}">
                           <i class="bi bi-grid-3x3-gap me-1"></i>Toutes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if current_kev == '1' %}active{% endif %}"
                           href="{{ url_for('index', kev='1') }}">
                           <i class="bi bi-exclamation-triangle me-1"></i>KEV
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle {% if current_severity %}active{% endif %}" href="#"
                           role="button" data-bs-toggle="dropdown">
                           <i class="bi bi-funnel me-1"></i>Sévérité
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark">
                            <li><a class="dropdown-item" href="{{ url_for('index', severity='CRITICAL') }}">
                                <span class="badge badge-critical me-2">CRITICAL</span>Critique
                            </a></li>
                            <li><a class="dropdown-item" href="{{ url_for('index', severity='HIGH') }}">
                                <span class="badge badge-high me-2">HIGH</span>Élevée
                            </a></li>
                            <li><a class="dropdown-item" href="{{ url_for('index', severity='MEDIUM') }}">
                                <span class="badge badge-medium me-2">MEDIUM</span>Moyenne
                            </a></li>
                            <li><a class="dropdown-item" href="{{ url_for('index', severity='LOW') }}">
                                <span class="badge badge-low me-2">LOW</span>Faible
                            </a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="{{ url_for('index') }}">Toutes</a></li>
                        </ul>
                    </li>
                </ul>
                <form class="d-flex vg-search-form" action="{{ url_for('index') }}" method="get" role="search">
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0">
                            <i class="bi bi-search text-muted"></i>
                        </span>
                        <input type="search" name="q" class="form-control border-start-0"
                               placeholder="CVE, vendor, produit…"
                               value="{{ search_query if search_query else '' }}"
                               autocomplete="off" id="searchInput">
                    </div>
                </form>
            </div>
        </div>
    </nav>

    <main class="container-fluid px-4 py-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="vg-footer text-center py-3 mt-4">
        <small class="text-muted">
            Vigilant Guardian — Veille CVE défensive &bull; Projet académique 2026
        </small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
